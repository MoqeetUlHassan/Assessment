<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance Requests · Admin</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header></header>
  <main>
    <h1>Organization admin</h1>
    <div id="message"></div>

    <section id="threshold-section" hidden>
      <h2>Approval threshold</h2>
      <p id="threshold-current"></p>
      <form id="threshold" class="inline">
        <label>New threshold <input name="amount" type="number" min="0" max="10000000" step="0.01" required></label>
        <label>Reason <input name="reason" required maxlength="1000"></label>
        <button type="submit">Change threshold</button>
      </form>
      <p class="muted">Applies only to requests raised after the change; existing requests keep the threshold they were raised under.</p>
    </section>

    <section id="users-section" hidden>
      <h2>Users</h2>
      <div class="scroll"><table id="users"></table></div>
      <h3>Add user</h3>
      <form id="create-user" class="stack">
        <label>Name <input name="displayName" required maxlength="200"></label>
        <label>Email <input name="email" type="email" required maxlength="254"></label>
        <label>Initial password (min 12 characters) <input name="password" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label>
        <label>Role <select name="roleId" required></select></label>
        <button type="submit">Add user</button>
      </form>
    </section>

    <section id="roles-section" hidden>
      <h2>Roles and permissions</h2>
      <div id="roles"></div>
      <h3>Add role</h3>
      <form id="create-role" class="stack">
        <label>Name <input name="name" required maxlength="100"></label>
        <div id="create-role-permissions"></div>
        <button type="submit">Add role</button>
      </form>
    </section>

    <section id="audit-section" hidden>
      <h2>Organization audit log (latest 50)</h2>
      <div class="scroll"><table id="audit"></table></div>
    </section>
  </main>
  <script src="/app.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
