<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance Requests</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header></header>
  <main>
    <h1>Requests</h1>

    <section id="create-section" hidden>
      <h2>New request</h2>
      <form id="create" class="stack">
        <label>Site <select name="siteId" required></select></label>
        <label>Description <textarea name="description" required maxlength="2000"></textarea></label>
        <label>Estimated cost <input name="estimatedCost" type="number" min="0.01" max="10000000" step="0.01" required></label>
        <button type="submit">Raise request</button>
        <div id="create-message"></div>
      </form>
    </section>

    <h2>All requests in your organization</h2>
    <form id="filter" class="inline">
      <label>Status
        <select name="status">
          <option value="">All</option>
          <option value="PendingApproval">Pending approval</option>
          <option value="Approved">Approved</option>
          <option value="Completed">Completed</option>
          <option value="Rejected">Rejected</option>
        </select>
      </label>
      <label>Site <select name="siteId"><option value="">All</option></select></label>
      <button type="submit">Filter</button>
    </form>
    <div id="list-message"></div>
    <div class="scroll"><table id="requests"></table></div>
    <div class="pager" id="pager"></div>
  </main>
  <script src="/app.js"></script>
  <script src="/requests.js"></script>
</body>
</html>
