<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance Requests · Sign in</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>Maintenance Requests</h1>
    <form id="login" class="stack" method="post" autocomplete="on">
      <label>Email <input name="email" type="email" required maxlength="254" autocomplete="username"></label>
      <label>Password <input name="password" type="password" required maxlength="200" autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
      <div id="message"></div>
    </form>
    <p class="muted">Development seed accounts: see README (password <code>ChangeMe-Dev-2026!</code>), e.g. requester@acme.test, approver1@acme.test.</p>
  </main>
  <script src="/app.js"></script>
  <script src="/login.js"></script>
</body>
</html>
